services:
  # Static site: the database and API run inside the visitor's browser (see README, "Static website").
  - type: web
    name: chemical-inventory
    runtime: static
    buildCommand: npm install --include=dev && npm run build:static
    staticPublishPath: ./dist
    envVars:
      - key: NODE_VERSION
        value: "22"
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
